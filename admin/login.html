<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Entrar | Lírio Semijoias Admin</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/png" href="../assets/favicon-64.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700&family=Manrope:wght@400;500;600;700&display=swap" />

  <link rel="stylesheet" href="../css/reset.css" />
  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/admin.css" />
</head>
<body class="admin-login-pagina">
  <main class="admin-login">
    <div class="admin-login__cartao">
      <img src="../assets/logo.jpeg" alt="Lírio Semijoias" width="56" height="56" class="admin-login__logo" />
      <h1>Painel administrativo</h1>
      <p class="admin-login__subtitulo">Entre pra gerenciar o catálogo.</p>

      <form id="formulario-login" novalidate>
        <div class="campo">
          <label for="campo-email">E-mail</label>
          <input type="email" id="campo-email" name="email" autocomplete="username" required />
        </div>

        <div class="campo">
          <label for="campo-senha">Senha</label>
          <input type="password" id="campo-senha" name="senha" autocomplete="current-password" required />
        </div>

        <p id="mensagem-erro" class="mensagem-erro" role="alert" aria-live="assertive"></p>

        <button type="submit" id="botao-entrar" class="botao botao--primario botao--bloco">Entrar</button>
      </form>

      <a href="../index.html" class="admin-login__voltar">← Voltar pro site</a>
    </div>
  </main>

  <script type="module" src="../js/admin/login.js"></script>
</body>
</html>
